<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AUB Digital Academy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link href="../../css/base/variables.css" rel="stylesheet">
    <link href="../../css/base/reset.css" rel="stylesheet">
    <link href="../../css/base/typography.css" rel="stylesheet">
    <link href="../../css/base/global.css" rel="stylesheet">
    
    <link href="../../css/components/button.css" rel="stylesheet">
    <link href="../../css/components/input.css" rel="stylesheet">
    
    <link href="../../css/layouts/authentication.css" rel="stylesheet">
    <link href="../../css/pages/login.css" rel="stylesheet">
</head>
<body>

    <main class="auth-layout">
        
        <!-- Left Panel: Branding -->
        <section class="auth-panel-brand">
            <div class="auth-decor"></div>
            <div class="auth-brand-content">
                <div class="mb-5 d-flex align-items-center gap-2">
                    <div class="bg-surface rounded p-2 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
                    </div>
                    <span class="fs-4 fw-bold">AUB Digital</span>
                </div>
            </div>
            
            <div class="auth-brand-content mt-auto">
                <h1 class="display-5 fw-bold">Password Recovery</h1>
                <p class="mt-3">Don't worry, we'll help you get back into your account safely and securely.</p>
            </div>
        </section>

        <!-- Right Panel: Form -->
        <section class="auth-panel-form">
            <div class="auth-form-wrapper fade-up">
                
                <a href="login.html" class="text-secondary text-decoration-none d-flex align-items-center gap-2 mb-4 d-inline-block hover-primary transition-fast">
                    <i class="bi bi-arrow-left"></i>
                    <span class="fw-medium">Back to Login</span>
                </a>

                <div class="auth-form-header">
                    <h2>Reset Password</h2>
                    <p>Enter your University ID or Email to receive a reset link.</p>
                </div>

                <form action="reset-password.html" method="GET">
                    
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-surface border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="Enter your email" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                        Send Reset Link
                    </button>
                    
                    <a href="login.html" class="btn btn-outline w-100 btn-lg">
                        Cancel
                    </a>
                    
                </form>

            </div>
        </section>

    </main>

</body>
</html>
