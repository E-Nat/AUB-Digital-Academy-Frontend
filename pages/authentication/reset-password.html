<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - AUB Digital Academy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link href="../../css/base/variables.css" rel="stylesheet">
    <link href="../../css/base/reset.css" rel="stylesheet">
    <link href="../../css/base/typography.css" rel="stylesheet">
    <link href="../../css/base/global.css" rel="stylesheet">
    
    <link href="../../css/components/button.css" rel="stylesheet">
    <link href="../../css/components/input.css" rel="stylesheet">
    
    <link href="../../css/layouts/authentication.css" rel="stylesheet">
    <link href="../../css/pages/login.css" rel="stylesheet">
</head>
<body>

    <main class="auth-layout">
        
        <section class="auth-panel-brand">
            <div class="auth-decor"></div>
            <div class="auth-brand-content mt-auto">
                <h1 class="display-5 fw-bold">Secure Your Account</h1>
                <p class="mt-3">Create a strong password to protect your academic data and personal information.</p>
            </div>
        </section>

        <section class="auth-panel-form">
            <div class="auth-form-wrapper fade-up">
                
                <div class="auth-form-header">
                    <h2>Set New Password</h2>
                    <p>Please create a strong password for your account.</p>
                </div>

                <form action="login.html" method="GET">
                    
                    <div class="mb-4">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-surface border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 border-end-0 px-0" id="newPassword" placeholder="Enter new password" required autofocus>
                            <button class="btn border border-start-0 text-muted toggle-pwd" type="button">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-surface border-end-0 text-muted">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 border-end-0 px-0" id="confirmPassword" placeholder="Confirm your new password" required>
                            <button class="btn border border-start-0 text-muted toggle-pwd" type="button">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        Reset Password
                    </button>
                    
                </form>

            </div>
        </section>

    </main>

    <script>
        document.querySelectorAll('.toggle-pwd').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            });
        });
    </script>
</body>
</html>
