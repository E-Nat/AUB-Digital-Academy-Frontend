<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Management — AUB Digital Academy Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../../css/layouts/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

    <!-- Mobile Sidebar Backdrop -->
    <div class="admin-sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="admin-wrapper">
        <!-- Sidebar (rendered by admin-layout.js) -->
        <aside class="admin-sidebar"></aside>

        <!-- Main -->
        <main class="admin-main">
            <header class="admin-topbar">
                <button class="admin-hamburger" id="adminHamburger" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <div class="admin-search-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="admin-search-input" id="enrollmentSearchInput" placeholder="Search enrollments…" autocomplete="off">
                    <span class="admin-search-kbd d-none d-md-flex">Ctrl K</span>
                <div class="admin-topbar-actions">
                    <button class="admin-icon-btn" aria-label="Notifications"><i class="bi bi-bell"></i></button>
                    <div class="admin-topbar-profile" onclick="window.location.href='settings.html'">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=2563EB&color=fff&size=64" alt="Admin" class="admin-topbar-avatar">
                        <div class="admin-topbar-profile-info d-none d-md-block">
                            <div class="profile-name">Admin</div>
                            <div class="profile-role">System Administrator</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="admin-page-header">
                    <div>
                        <h1 class="admin-page-title">Enrollment Management</h1>
                        <p class="admin-page-subtitle">Track course enrollments, student progress, and completion records.</p>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="admin-table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ENROLLMENT ID</th>
                                    <th>STUDENT</th>
                                    <th>COURSE / PROGRAM</th>
                                    <th>DATE</th>
                                    <th>PROGRESS</th>
                                    <th>STATUS</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="enrollmentsTableBody">
                                <!-- Dynamically Rendered -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="admToastContainer" class="adm-toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const API_BASE = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
                ? 'http://localhost:5000/api'
                : '/api';

            function getAuthToken() {
                return localStorage.getItem('aub_auth_token') || 
                       localStorage.getItem('token') || 
                       sessionStorage.getItem('aub_auth_token') || 
                       sessionStorage.getItem('token') || '';
            }

            function getHeaders() {
                const token = getAuthToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;
                return headers;
            }

            let allEnrollments = [];

            async function loadEnrollments() {
                try {
                    const res = await fetch(`${API_BASE}/admin/enrollments`, { headers: getHeaders() });
                    const data = await res.json();
                    if (data.success && data.data) {
                        allEnrollments = data.data;
                        renderEnrollments(allEnrollments);
                    }
                } catch (e) {
                    console.error('Error loading enrollments:', e);
                }
            }

            function renderEnrollments(items) {
                const tbody = document.getElementById('enrollmentsTableBody');
                if (!tbody) return;

                tbody.innerHTML = items.map(e => `
                    <tr>
                        <td class="text-muted fw-bold">#ENR-${e.id}</td>
                        <td>
                            <div class="fw-bold text-dark">${escapeHtml(e.student_name || 'Student')}</div>
                            <div class="text-xs text-muted">${escapeHtml(e.student_id || e.student_email || '')}</div>
                        </td>
                        <td><span class="fw-semibold text-primary">${escapeHtml(e.course_title || e.program_title || 'Academic Course')}</span></td>
                        <td class="text-muted text-xs">${formatDate(e.enrollment_date)}</td>
                        <td style="width: 140px;">
                            <div class="d-flex align-items-center gap-2">
                                <div class="progress flex-grow-1" style="height: 6px; background: #F1F5F9; border-radius: 6px;">
                                    <div class="progress-bar bg-success" style="width: ${e.progress_percentage || 0}%; border-radius: 6px;"></div>
                                </div>
                                <span class="text-xs fw-bold text-muted">${e.progress_percentage || 0}%</span>
                            </div>
                        </td>
                        <td><span class="admin-status-badge ${(e.status || 'active').toLowerCase()}">${escapeHtml(e.status || 'Active')}</span></td>
                        <td>
                            <button class="action-btn delete" title="Delete Enrollment" onclick="deleteEnrollment(${e.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            const searchInput = document.getElementById('enrollmentSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function (e) {
                    const q = e.target.value.toLowerCase();
                    const filtered = allEnrollments.filter(item => 
                        (item.student_name && item.student_name.toLowerCase().includes(q)) ||
                        (item.course_title && item.course_title.toLowerCase().includes(q)) ||
                        (item.student_id && item.student_id.toLowerCase().includes(q))
                    );
                    renderEnrollments(filtered);
                });
            }

            window.deleteEnrollment = async function (id) {
                const token = getAuthToken();
                if (!token) return;
                if (!confirm('Are you sure you want to remove this enrollment record?')) return;
                try {
                    const res = await fetch(`${API_BASE}/admin/enrollments/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data.success) loadEnrollments();
                } catch (err) {
                    console.error(err);
                }
            };

            function formatDate(dateStr) {
                if (!dateStr) return '2026-05-24';
                return dateStr.split(' ')[0] || dateStr.split('T')[0];
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadEnrollments();
        });
    </script>
</body>
</html>
