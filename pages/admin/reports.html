<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics — AUB Digital Academy Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../../css/layouts/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="admin-wrapper">
        <aside class="admin-sidebar"></aside>
        <main class="admin-main">
            <header class="admin-topbar">
                <button class="admin-hamburger" id="adminHamburger" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
                <div class="admin-search-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="admin-search-input" placeholder="Search…" autocomplete="off">
                    <span class="admin-search-kbd d-none d-md-flex">Ctrl K</span>
                </div>
                <div class="admin-topbar-actions">
                    <button class="admin-icon-btn" aria-label="Notifications"><i class="bi bi-bell"></i></button>
                    <div class="admin-topbar-profile" onclick="window.location.href='settings.html'">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=2563EB&color=fff&size=64" alt="Admin" class="admin-topbar-avatar">
                        <div class="admin-topbar-profile-info d-none d-md-block">
                            <div class="profile-name">Admin</div>
                            <div class="profile-role">System Administrator</div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="admin-content">
                <div class="admin-page-header">
                    <div>
                        <h1 class="admin-page-title">Reports & Analytics</h1>
                        <p class="admin-page-subtitle">View enrollment, financial, exam performance, and student progress reports.</p>
                    </div>
                </div>
                <div class="admin-card">
                    <div class="adm-empty-state">
                        <i class="bi bi-bar-chart-line"></i>
                        <h5>Reports & Analytics</h5>
                        <p>This module is coming in the next implementation phase. Stay tuned!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="admToastContainer" class="adm-toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/admin-layout.js"></script>
</body>
</html>
