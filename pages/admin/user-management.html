<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AUB Digital Academy</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Admin CSS -->
    <link href="../../css/layouts/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-wrapper">
        
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">
                <div class="admin-brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <div class="admin-brand-text">
                    <div class="title">AUB DIGITAL</div>
                    <div class="subtitle">ACADEMY</div>
                </div>
            </div>

            <nav class="admin-sidebar-menu">
                <a href="dashboard.html" class="admin-nav-item">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="user-management.html" class="admin-nav-item active">
                    <i class="bi bi-people-fill"></i>
                    <span>User Management</span>
                </a>
                <a href="academic-management.html" class="admin-nav-item">
                    <i class="bi bi-mortarboard-fill"></i>
                    <span>Academic Management</span>
                </a>
                <a href="enrollment-management.html" class="admin-nav-item">
                    <i class="bi bi-person-lines-fill"></i>
                    <span>Enrollment Management</span>
                </a>
                <a href="settings.html" class="admin-nav-item">
                    <i class="bi bi-gear-fill"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <button class="admin-logout-btn" onclick="localStorage.clear(); sessionStorage.clear(); window.location.href='../authentication/login.html';">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN VIEW -->
        <main class="admin-main">
            
            <header class="admin-topbar">
                <div class="admin-search-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" class="admin-search-input" id="userSearchInput" placeholder="Search by name, email, ID...">
                </div>

                <div class="admin-topbar-actions">
                    <button class="admin-notification-btn"><i class="bi bi-bell-fill"></i><span class="admin-notification-badge">3</span></button>
                    <div class="admin-topbar-profile" onclick="window.location.href='settings.html'">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150" alt="Admin">
                        <div class="d-none d-md-block text-start lh-1">
                            <div class="name">Admin</div>
                            <div class="role">System Administrator</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="admin-header-row">
                    <div>
                        <h1 class="admin-page-title">User Management</h1>
                        <p class="admin-page-subtitle">Manage student accounts, teacher credentials, and administrators.</p>
                    </div>
                    <button class="btn btn-primary rounded-pill px-4 fw-semibold" onclick="openCreateUserModal()">
                        <i class="bi bi-person-plus-fill me-2"></i> Add New User
                    </button>
                </div>

                <div class="admin-card">
                    <div class="admin-table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>USER</th>
                                    <th>UNIVERSITY ID</th>
                                    <th>EMAIL</th>
                                    <th>ROLE</th>
                                    <th>STATUS</th>
                                    <th>JOINED</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Dynamically Rendered from SQLite -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: Create / Edit User -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold" id="userModalTitle">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="modal-body px-4">
                        <div class="mb-3">
                            <label class="form-label text-sm fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="userName" required placeholder="e.g. Somnang Sok">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-sm fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="userEmail" required placeholder="e.g. somnang@aub.edu.kh">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label text-sm fw-semibold">University ID</label>
                                <input type="text" class="form-control" id="userUniId" placeholder="e.g. 0001009">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-sm fw-semibold">Role *</label>
                                <select class="form-select" id="userRole">
                                    <option value="3">Student</option>
                                    <option value="2">Teacher</option>
                                    <option value="1">Admin</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label text-sm fw-semibold">Status</label>
                                <select class="form-select" id="userStatus">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-sm fw-semibold" id="passwordLabel">Password *</label>
                                <input type="password" class="form-control" id="userPassword" placeholder="Enter password">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold" id="submitUserBtn">Save Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const isLocal = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.protocol === 'file:';
            const API_BASE = (isLocal && window.location.port !== '5000') 
                ? 'http://localhost:5000/api' 
                : '/api';

            function getAuthToken() {
                return localStorage.getItem('aub_auth_token') || 
                       localStorage.getItem('token') || 
                       sessionStorage.getItem('aub_auth_token') || 
                       sessionStorage.getItem('token') || '';
            }

            function getHeaders() {
                const token = getAuthToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                return headers;
            }

            let allUsers = [];
            const userModalEl = document.getElementById('userModal');
            const userModal = new bootstrap.Modal(userModalEl);

            async function loadUsers() {
                const token = getAuthToken();
                if (!token) {
                    console.warn('No active JWT session found. Redirecting to login.');
                    window.location.href = '../authentication/login.html';
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/admin/users`, { headers: getHeaders() });
                    if (res.status === 401 || res.status === 403) {
                        localStorage.clear();
                        window.location.href = '../authentication/login.html';
                        return;
                    }
                    const data = await res.json();
                    if (data.success && data.data) {
                        allUsers = data.data;
                        renderUsers(allUsers);
                    }
                } catch (e) {
                    console.error('Error loading users:', e);
                }
            }

            function renderUsers(users) {
                const tbody = document.getElementById('usersTableBody');
                if (!tbody) return;

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No users found</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="${u.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150'}" class="rounded-circle object-fit-cover" style="width: 38px; height: 38px;">
                                <div class="fw-bold text-dark">${escapeHtml(u.full_name)}</div>
                            </div>
                        </td>
                        <td class="text-muted fw-semibold">${escapeHtml(u.university_id || 'N/A')}</td>
                        <td class="text-muted">${escapeHtml(u.email)}</td>
                        <td>
                            <span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : u.role === 'TEACHER' ? 'bg-primary' : 'bg-success'} px-3 py-1 rounded-pill">
                                ${u.role}
                            </span>
                        </td>
                        <td><span class="admin-status-badge ${(u.status || 'active').toLowerCase()}">${u.status || 'Active'}</span></td>
                        <td class="text-muted text-xs">${formatDate(u.created_at)}</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="action-btn" title="Edit User" onclick="openEditUserModal(${JSON.stringify(u).replace(/"/g, '&quot;')})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="action-btn delete" title="Delete User" onclick="deleteUser(${u.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            const search = document.getElementById('userSearchInput');
            if (search) {
                search.addEventListener('input', function (e) {
                    const q = e.target.value.toLowerCase();
                    const filtered = allUsers.filter(u => 
                        u.full_name.toLowerCase().includes(q) ||
                        u.email.toLowerCase().includes(q) ||
                        (u.university_id && u.university_id.toLowerCase().includes(q))
                    );
                    renderUsers(filtered);
                });
            }

            window.openCreateUserModal = function () {
                document.getElementById('userForm').reset();
                document.getElementById('userId').value = '';
                document.getElementById('userModalTitle').textContent = 'Add New User';
                document.getElementById('passwordLabel').textContent = 'Password *';
                document.getElementById('userPassword').required = true;
                userModal.show();
            };

            window.openEditUserModal = function (u) {
                document.getElementById('userId').value = u.id;
                document.getElementById('userName').value = u.full_name;
                document.getElementById('userEmail').value = u.email;
                document.getElementById('userUniId').value = u.university_id || '';
                document.getElementById('userRole').value = u.role_id || (u.role === 'ADMIN' ? 1 : u.role === 'TEACHER' ? 2 : 3);
                document.getElementById('userStatus').value = u.status || 'Active';
                document.getElementById('userPassword').value = '';
                document.getElementById('userPassword').required = false;
                document.getElementById('passwordLabel').textContent = 'Password (leave blank to keep current)';
                document.getElementById('userModalTitle').textContent = 'Edit User Account';
                userModal.show();
            };

            const form = document.getElementById('userForm');
            if (form) {
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const token = getAuthToken();
                    if (!token) {
                        alert('Authentication required: Please log in as an administrator.');
                        window.location.href = '../authentication/login.html';
                        return;
                    }

                    const id = document.getElementById('userId').value;
                    const payload = {
                        full_name: document.getElementById('userName').value.trim(),
                        email: document.getElementById('userEmail').value.trim(),
                        university_id: document.getElementById('userUniId').value.trim(),
                        role_id: parseInt(document.getElementById('userRole').value),
                        status: document.getElementById('userStatus').value,
                        password: document.getElementById('userPassword').value
                    };

                    const submitBtn = document.getElementById('submitUserBtn');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Saving...';
                    }

                    const url = id ? `${API_BASE}/admin/users/${id}` : `${API_BASE}/admin/users`;
                    const method = id ? 'PUT' : 'POST';

                    try {
                        const res = await fetch(url, {
                            method,
                            headers: getHeaders(),
                            body: JSON.stringify(payload)
                        });

                        const result = await res.json();
                        if (res.ok && result.success) {
                            userModal.hide();
                            form.reset();
                            loadUsers();
                        } else {
                            alert(result.message || 'Failed to save user.');
                        }
                    } catch (err) {
                        console.error('Save user error:', err);
                        alert('Error saving user: ' + err.message);
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Save Account';
                        }
                    }
                });
            }

            window.deleteUser = async function (id) {
                const token = getAuthToken();
                if (!token) {
                    alert('Please log in as an administrator first.');
                    return;
                }

                if (!confirm('Are you sure you want to delete this user?')) return;
                try {
                    const res = await fetch(`${API_BASE}/admin/users/${id}`, {
                        method: 'DELETE',
                        headers: getHeaders()
                    });
                    const result = await res.json();
                    if (result.success) {
                        loadUsers();
                    } else {
                        alert(result.message || 'Failed to delete user.');
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            function formatDate(dateStr) {
                if (!dateStr) return '2026-05-24';
                return dateStr.split(' ')[0] || dateStr.split('T')[0];
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadUsers();
        });
    </script>
</body>
</html>
