<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - AUB Digital Academy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link href="../../css/base/variables.css" rel="stylesheet">
    <link href="../../css/base/reset.css" rel="stylesheet">
    <link href="../../css/base/typography.css" rel="stylesheet">
    <link href="../../css/base/global.css" rel="stylesheet">
    
    <link href="../../css/components/button.css" rel="stylesheet">
    
    <link href="../../css/layouts/authentication.css" rel="stylesheet">
    <link href="../../css/pages/login.css" rel="stylesheet">
</head>
<body>

    <main class="auth-layout">
        
        <section class="auth-panel-form mx-auto w-100">
            <div class="auth-form-wrapper text-center fade-up">
                
                <div class="mb-4 mx-auto d-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle" style="width: 100px; height: 100px;">
                    <i class="bi bi-shield-lock-fill text-danger" style="font-size: 3rem;"></i>
                </div>
                
                <h2 class="fw-bold text-primary mb-3" style="font-size: 2.25rem; letter-spacing: -0.02em;">Access Denied</h2>
                
                <p class="text-secondary mb-5 mx-auto" style="max-width: 340px;">
                    You do not have permission to access this page. Please contact your administrator if you believe this is a mistake.
                </p>

                <a href="login.html" class="btn btn-primary w-100 btn-lg mb-3">
                    Return to Login
                </a>
                
                <button class="btn btn-outline w-100 btn-lg" onclick="history.back()">
                    Go Back
                </button>

            </div>
        </section>

    </main>

</body>
</html>
